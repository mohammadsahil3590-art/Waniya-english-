<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>WANIYA - English Teacher AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       APP
  ========================== -->

  <div class="app">

    <!-- HEADER -->

    <header class="topbar">

      <div class="brand">
        <div class="logo">W</div>

        <div>
          <h1>WANIYA</h1>
          <p>English Teacher AI</p>
        </div>
      </div>

      <button class="settings-btn" id="settingsBtn">
        ⚙️
      </button>

    </header>


    <!-- =========================
         TEACHER AREA
    ========================== -->

    <main class="teacher-section">

      <div class="welcome">

        <span class="small-text">
          HELLO 👋
        </span>

        <h2>
          I'm WANIYA
        </h2>

        <p>
          Your personal English teacher
        </p>

      </div>


      <!-- TEACHER AVATAR -->

      <div class="teacher-container">

        <div class="glow"></div>

        <div class="teacher-avatar">

          <div class="avatar-face">

            <div class="hair"></div>

            <div class="eyes">
              <span></span>
              <span></span>
            </div>

            <div class="nose"></div>

            <div class="mouth"></div>

          </div>

          <div class="neck"></div>

          <div class="body">

            <div class="shirt"></div>

          </div>

        </div>

      </div>


      <!-- SPEECH -->

      <div class="speech-box">

        <div class="speech-icon">
          💬
        </div>

        <div>
          <strong>
            Welcome!
          </strong>

          <p>
            Let's improve your English together.
          </p>
        </div>

      </div>


      <!-- =========================
           START BUTTON
      ========================== -->

      <button class="start-btn" id="startBtn">

        <span class="mic-icon">
          🎤
        </span>

        <span>
          Start Speaking
        </span>

      </button>


      <p class="hint">
        Tap the button and start speaking in English
      </p>

    </main>


    <!-- =========================
         BOTTOM MENU
    ========================== -->

    <nav class="bottom-nav">

      <button class="nav-item active">

        <span>🏠</span>
        <small>Home</small>

      </button>


      <button class="nav-item">

        <span>🗣️</span>
        <small>Practice</small>

      </button>


      <button class="nav-item">

        <span>📚</span>
        <small>Lessons</small>

      </button>


      <button class="nav-item">

        <span>👤</span>
        <small>Profile</small>

      </button>

    </nav>

  </div>


  <script src="app.js"></script>

</body>
</html>
